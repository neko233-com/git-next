version: '3'

# Go 1.27 is the only implementation language in this repository. Native C/MSI
# inputs are built by tools/devtool, not by cargo or rustc.

env:
  GOTOOLCHAIN: go1.27.3
  CGO_ENABLED: '0'

vars:
  CLI_BIN: '{{if eq OS "windows"}}target/release/git.exe{{else}}target/release/git{{end}}'
  # Current-platform release asset; cross-platform packaging is available by
  # passing an explicit platform to `package-release` (windows-x64, linux-x64,
  # linux-arm64, macos-arm64).
  RELEASE_PLATFORM: '{{if eq OS "windows"}}windows-x64{{else if eq OS "linux"}}{{if eq ARCH "arm64"}}linux-arm64{{else}}linux-x64{{end}}{{else if eq OS "darwin"}}macos-arm64{{else}}windows-x64{{end}}'

tasks:
  default:
    cmds:
      - task: verify

  fmt:
    desc: Format all Go modules
    cmds:
      - gofmt -w cmd internal tools/devtool

  fmt:check:
    desc: Fail when any Go file is unformatted
    cmds:
      - test -z "$(gofmt -l cmd internal tools/devtool)"

  vet:
    desc: Vet the client and every independent Go module
    cmds:
      - go vet -mod=mod ./...
      - go -C tools/devtool vet ./...
      - go -C tools/git-p4 vet ./...

  test:
    desc: Run all Go tests with shuffled order and no cache
    cmds:
      - go test -mod=mod -shuffle=on -count=1 ./...
      - go -C tools/devtool test -shuffle=on -count=1 ./...
      - go -C tools/git-p4 test -shuffle=on -count=1 ./...

  deps:verify:
    desc: Verify locked module dependencies
    cmds:
      - go mod verify
      - go -C tools/devtool mod verify
      - go -C tools/git-p4 mod verify

  test:cover:
    desc: Produce a coverage profile for the client module
    env:
      GOFLAGS: -mod=mod
    cmds:
      - mkdir -p target/coverage
      - go test -mod=mod -covermode=atomic -coverprofile=target/coverage/client.out ./...
      - go tool cover -func=target/coverage/client.out | tail -1

  locales:
    desc: Validate locale documents against Go source messages
    cmds:
      - go -C tools/devtool run . check-locales --coverage

  contract:
    desc: Check the repository contract encoded in AGENTS.md
    cmds:
      - go -C tools/devtool run . verify-repo-contract

  no-rust:
    desc: Refuse Rust sources, Cargo files and rust toolchain calls
    cmds:
      - 'test -z "$(find . -name "*.rs" | grep -v target)"'
      - 'test -z "$(find . -name Cargo.toml)"'
      - 'test -z "$(find . -name Cargo.lock)"'
      - 'test -z "$(find . -name rust-toolchain.toml)"'
      - 'test -z "$(grep -R -n -E "(^|[^a-zA-Z])(cargo|rustc)([^a-zA-Z]|$)" tools/devtool --include="*.go" | grep -v "_test.go:")"'

  no-cgo:
    desc: Refuse cgo source and require CGO_ENABLED=0
    cmds:
      - test "$(go env CGO_ENABLED)" = "0"
      - 'test -z "$(grep -R -n -E "^[[:space:]]*import[[:space:]]+\"C\"|#cgo" cmd internal tools --include="*.go")"'

  build:
    desc: Build the Go client into target/release
    cmds:
      - go -C tools/devtool run . build-go-client

  package:release:
    desc: Package a CGO-free distributable archive for the current platform (no upload, no tag)
    cmds:
      - task: no-cgo
      - task: build
      - go -C tools/devtool run . package-release {{.RELEASE_PLATFORM}}

  accept:l0:
    desc: CLI acceptance, L0 merge/tag gate
    deps: [build]
    cmds:
      - go -C tools/devtool run . cli-accept --tier l0 --json target/cli-accept-l0.json

  accept:full:
    desc: CLI acceptance, full release gate
    deps: [build]
    cmds:
      - go -C tools/devtool run . cli-accept --tier full --json target/cli-accept-full.json

  docs:
    desc: Regenerate tracked HTML manuals
    cmds:
      - go -C tools/devtool run . render-docs

  docs:react:check:
    desc: Format/lint/type-check the React 19 docs app with vite-plus
    dir: github-docs
    cmds:
      - pnpm exec vp check

  docs:react:test:
    desc: Run React docs content tests
    dir: github-docs
    cmds:
      - pnpm exec vp test --run

  docs:react:build:
    desc: Build the React docs app for GitHub Pages
    dir: github-docs
    cmds:
      - pnpm build

  docs:react:verify:
    desc: Mandatory gate for the GitHub docs app
    cmds:
      - task: docs:react:check
      - task: docs:react:test
      - task: docs:react:build

  docs:stage:assets:
    desc: Stage local CGO-free release assets for the website download center
    cmds:
      - test -f target/release-assets/SHA256SUMS
      - mkdir -p github-docs/dist/downloads
      - cp target/release-assets/* github-docs/dist/downloads/

  docs:publish:react:
    desc: Publish the built React docs and local preview assets to gh-pages
    cmds:
      - task: docs:react:build
      - task: docs:stage:assets
      - go -C tools/devtool run . publish-docs --dist github-docs/dist

  docs:publish:react:dry:
    desc: Preview the React docs publication without changing refs
    cmds:
      - task: docs:react:build
      - task: docs:stage:assets
      - go -C tools/devtool run . publish-docs --dist github-docs/dist --dry-run

  verify:
    desc: Mandatory local gate for commits
    cmds:
      - task: fmt:check
      - task: vet
      - task: test
      - task: deps:verify
      - task: locales
      - task: no-rust
      - task: no-cgo
      - task: contract
      - task: accept:l0

  release:check:
    desc: Release gates; does not publish or create a tag
    cmds:
      - task: verify
      - task: docs:react:verify
      - task: accept:full
      - go -C tools/devtool run . check-runtime-defaults
      - go -C tools/devtool run . migration-audit --require-complete
      - echo "Release packaging is manual - run task package:release (no GitHub upload, no tag)."
